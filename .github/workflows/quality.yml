name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - uses: qltysh/qlty-action/install@v2
      - run: nub run check --require-qlty
      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ''|0000000000000000000000000000000000000000) COMMIT_RANGE=HEAD ;;
            *) COMMIT_RANGE="$BASE_SHA..HEAD" ;;
          esac
          export COMMIT_RANGE
          sh scripts/lint-commits.sh
